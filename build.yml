name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler le plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Installer Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.0'

      - name: Compiler
        run: gradle build --no-daemon --stacktrace

      - name: Lister les jars créés
        run: ls -la build/libs/

      - name: Envoyer le jar (onglet Actions, section Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: horror-spider
          path: build/libs/*-all.jar
          if-no-files-found: error

      - name: Créer la Release (seulement si tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/libs/*-all.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes
